name: test

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master
  push:
    branches:
      - master

permissions: {}

jobs:
  linux:
    name: linux (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        allocator: [jemalloc]
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'
        - pypy3.11
        include:
          - python-version: 3.14t
            allocator: mimalloc
          - python-version: 3.15t
            allocator: mimalloc

    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false
    - name: Install
      env:
        UV_PYTHON: ${{ matrix.python-version }}
        ALLOCATOR: ${{ matrix.allocator }}
      run: |
        uv python install "$UV_PYTHON"
        uv venv .venv
        uv sync --group all
        uv run --no-sync maturin develop --uv --features "$ALLOCATOR"
    - name: Test
      run: |
        source .venv/bin/activate
        make test

  macos:
    name: macos (${{ matrix.python-version }})
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        allocator: [jemalloc]
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'
        include:
          - python-version: 3.14t
            allocator: mimalloc
          - python-version: 3.15t
            allocator: mimalloc

    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false
    - name: Install
      env:
        UV_PYTHON: ${{ matrix.python-version }}
        ALLOCATOR: ${{ matrix.allocator }}
      run: |
        uv python install "$UV_PYTHON"
        uv venv .venv
        uv sync --group all
        uv run --no-sync maturin develop --uv --features "$ALLOCATOR"
    - name: Test
      run: |
        source .venv/bin/activate
        make test

  windows:
    name: windows ${{ matrix.runner == 'windows-11-arm' && 'arm64' || 'x64' }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.14t'
        - '3.15'
        - '3.15t'
        exclude:
          # no CPython 3.10 build available for win_arm64
          - runner: windows-11-arm
            python-version: '3.10'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false
    - name: Resolve Python version request
      # uv resolves bare requests to an emulated x86_64 build on Windows ARM64
      env:
        PY_VERSION: ${{ matrix.python-version }}
        PY_ARCH: ${{ matrix.runner == 'windows-11-arm' && 'aarch64' || 'x86_64' }}
      run: |
        $version = $env:PY_VERSION -replace 't$','+freethreaded'
        "UV_PYTHON=cpython-$version-windows-$($env:PY_ARCH)-none" >> $env:GITHUB_ENV
    - name: Install
      run: |
        uv python install $env:UV_PYTHON
        uv venv .venv
        uv sync --group all
        uv run --no-sync maturin develop --uv --features mimalloc
    - name: Test
      run: |
        uv run --no-sync pytest -v tests
